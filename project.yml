name: Stajanka
options:
  developmentLanguage: be
  bundleIdPrefix: by.stajanka
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_CFBundleDisplayName: Стаянка
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Покажем ваше положение и ближайшие парковки на карте.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 4
targets:
  Stajanka:
    type: application
    platform: iOS
    sources: [Stajanka]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.stajanka.app
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  StajankaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Stajanka
  StajankaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Stajanka
schemes:
  Stajanka:
    build:
      targets:
        Stajanka: all
    test:
      targets: [StajankaTests, StajankaUITests]

  StajankaScreenshots:
    build:
      targets:
        Stajanka: all
    test:
      targets: [StajankaUITests]
      environmentVariables:
        STAJANKA_CAPTURE_SCREENSHOTS: '1'
